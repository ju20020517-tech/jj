<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>친구모아 아일랜드</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="fm.css" />
  <link rel="stylesheet" href="ui2.css" />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="glass.css" />
</head>
<body data-view="island">
  <canvas id="game"></canvas>
  <div id="warm"></div>
  <div id="bubbles"></div>
  <div id="fade"></div>
  <div id="loading" hidden>🏝️ 섬으로 가는 중…</div>
  <div id="start" hidden></div>

  <div id="hud" hidden>
    <div class="hud-top">
      <button class="chip title" id="hudTitle" title="시작 화면으로">🏝️ 친구모아 아일랜드</button>
      <div class="chip" id="hudTime">-</div>
      <div class="chip" id="hudWeather">-</div>
      <div class="chip speed"><button data-speed="0">⏸</button><button data-speed="1">×1</button><button data-speed="4">×4</button><button data-speed="15">×15</button><button data-speed="60">×60</button></div>
      <div class="chip" id="hudCoins">🪙 0</div>
      <div class="chip stam">⚡<div class="bar"><i id="hudStam"></i></div></div>
      <div class="chip mail" id="hudMail"></div>
      <div class="hud-btns">
        <button id="btnObserve" title="아파트 관찰 모드 (O)">🏢</button>
        <button id="btnMap" title="지도 (M)">🗺️</button>
        <button id="btnRel" title="관계도 (R)">🕸️</button>
        <button id="btnSound" title="소리">🔇</button>
        <button id="btnPanel" title="패널">☰</button>
      </div>
    </div>
    <div id="notif"></div>
    <div id="toasts"></div>
    <div id="banner" hidden></div>
    <div id="hint" hidden></div>
    <button id="hintBtn" hidden>행동</button>
    <div id="emotes"></div>

    <aside id="side" class="open">
      <nav>
        <button class="tab" data-tab="villagers">👥 주민</button>
        <button class="tab" data-tab="quest">📜 퀘스트</button>
        <button class="tab" data-tab="news">📰 소식</button>
        <button class="tab" data-tab="bag">🎒 가방</button>
        <button class="tab" data-tab="god">✨ 신의 툴</button>
        <button class="tab" data-tab="settings">⚙️</button>
        <button class="tab" data-tab="help">❓</button>
      </nav>
      <div id="sideBody"></div>
    </aside>

    <div id="obs" hidden></div>
    <div id="editor" hidden></div>
    <div id="dialog" hidden></div>
    <div id="map" hidden>
      <div class="map-head"><b>🗺️ 친구모아 아일랜드 지도</b><span class="muted">장소나 주민을 눌러 바로 이동하세요</span><button id="mapX" title="닫기 (M)">✕</button></div>
      <div class="map-body">
        <div class="map-cv"><canvas id="mapC" width="560" height="500"></canvas></div>
        <div class="map-side"><div id="mapInfo"></div><div id="mapList"></div></div>
      </div>
      <small class="map-legend">🔴 나 · ⚪ 주민 · 🩷 고민 중인 주민 · ⭐ 퀘스트 목적지 · 📍 표시한 목적지 · Ⓜ 지하철역</small>
    </div>
    <div id="qtrack" hidden></div>

    <div id="stick"><div id="knob"></div></div>
    <div class="mbtns">
      <button id="mSit">앉기</button><button id="mBug">채집</button><button id="mFish">낚시</button><button id="mRun">달리기</button><button id="mAct" class="big">행동</button>
    </div>
  </div>

  <div id="modal" hidden></div>
  <div id="dreamBox" hidden></div>
